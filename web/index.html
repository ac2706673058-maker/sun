function isBookmarked() {
  const off = currentOffset();
  return DB.marks.some(m => m.b === R.book.id && m.ch === R.ch && Math.abs(m.off - off) < 40);
}
function toggleBookmark() {
  const off = currentOffset();
  const i = DB.marks.findIndex(m => m.b === R.book.id && m.ch === R.ch && Math.abs(m.off - off) < 40);
  if (i >= 0) { DB.marks.splice(i, 1); toast('已移除书签'); }
  else {
    const txt = R.book.chapters[R.ch].text.slice(off, off + 42).replace(/\n/g, ' ');
    DB.marks.push({ b:R.book.id, ch:R.ch, off, ct:R.book.chapters[R.ch].title, ex:txt, at:Date.now() });
    toast('已添加书签'); if (cfg.haptic) buzz(10);
  }
  DB.save(); drawPanel();
}

/* =======================================================================
   听书 / 自动阅读
   ======================================================================= */
const SP = { on:false, range:null, ch:0, base:0, timer:0, left:0, iv:0 };
function speechVoices() {
  if (!window.speechSynthesis) return [];
  return speechSynthesis.getVoices().filter(v => /^zh/i.test(v.lang));
}
function startSpeak(fromOff) {
  if (!window.speechSynthesis) { toast('当前浏览器不支持朗读'); return; }
  speechSynthesis.cancel();
  const off = fromOff != null ? fromOff : currentOffset();
  const text = R.book.chapters[R.ch].text.slice(off);
  if (!text) return;
  const u = new SpeechSynthesisUtterance(text);
  const vs = speechVoices();
  const v = vs.find(x => x.name === cfg.voice) || vs[0];
  if (v) u.voice = v;
  u.lang = 'zh-CN';
  u.rate = .5 + cfg.rate * 1.5;
  SP.base = off; SP.ch = R.ch; SP.on = true;
  u.onboundary = e => {
    if (e.charIndex == null) return;
    SP.range = [off + e.charIndex, off + e.charIndex + (e.charLength || 2)];
    paintOverlay(R.front, R.ch);
    const pg = pageOfOffset(paneParts(R.front).flow, SP.range[0]);
    if (pg === R.page + 1) turn(1);
    else if (pg !== R.page) { R.page = pg; showPage(R.front, R.ch, pg); drawChrome(); }
  };
  u.onend = () => {
    if (!SP.on) return;
    if (R.ch + 1 < chapCount(R.book)) { jumpChapter(R.ch + 1, 0); startSpeak(0); }
    else { stopSpeak(); toast('全书朗读完毕'); }
  };
  speechSynthesis.speak(u);
  closeMenu(); drawChrome();
}
function stopSpeak() {
  SP.on = false; SP.range = null;
  window.speechSynthesis && speechSynthesis.cancel();
  clearInterval(SP.iv); SP.timer = 0; SP.left = 0;
  if (R.book) { paintOverlay(R.front, R.ch); drawChrome(); }
}
function sleepTimer(min) {
  clearInterval(SP.iv); SP.timer = min; SP.left = min * 60;
  if (!min) return;
  SP.iv = setInterval(() => { SP.left--; if (SP.left <= 0) { stopSpeak(); toast('定时结束'); } if (R.panel === 'speech') drawPanel(); }, 1000);
}
const AUTO = { on:false, raf:0, last:0, acc:0 };
function startAuto() {
  stopSpeak(); AUTO.on = true; AUTO.last = performance.now(); AUTO.acc = 0;
  const step = now => {
    if (!AUTO.on) return;
    const dt = Math.min(.1, (now - AUTO.last) / 1000); AUTO.last = now;
    if (cfg.autoMode === 'scroll' && cfg.mode === 'scroll') {
      paneParts(R.front).flow.scrollTop += (14 + cfg.autoSpeed * 96) * dt;
    } else {
      AUTO.acc += dt;
      if (AUTO.acc >= 11.5 - cfg.autoSpeed * 9.5) { AUTO.acc = 0; if (!turn(1)) stopAuto(); }
    }
    AUTO.raf = requestAnimationFrame(step);
  };
  AUTO.raf = requestAnimationFrame(step);
  closeMenu(); drawAutoBar(); drawChrome();
}
function stopAuto() {
  AUTO.on = false; cancelAnimationFrame(AUTO.raf);
  const b = $('#autoBar'); b && b.remove();
  R.book && drawChrome();
}
function drawAutoBar() {
  let b = $('#autoBar'); if (b) b.remove();
  b = el('div', 'autoBar'); b.id = 'autoBar';
  b.innerHTML = `<button data-a="-">−</button>
    <div style="text-align:center;width:62px"><div style="font-size:11px;font-weight:600">自动阅读</div>
    <div style="font-size:10px;color:var(--rsm)">速度 ${Math.round(cfg.autoSpeed * 100)}</div></div>
    <button data-a="+">＋</button><span style="width:1px;height:18px;background:var(--rsep)"></span>
    <button class="ex" data-a="x">退出</button>`;
  $('#reader').appendChild(b);
  b.onclick = e => {
    const a = e.target.closest('[data-a]'); if (!a) return;
    if (a.dataset.a === 'x') stopAuto();
    else { cfg.autoSpeed = clamp(cfg.autoSpeed + (a.dataset.a === '+' ? .1 : -.1), 0, 1); DB.save(); drawAutoBar(); }
  };
}

/* =======================================================================
   事件分发
   ======================================================================= */
function onReaderClick(e) {
  const t = e.target;
  const act = t.closest('[data-act]'), pan = t.closest('[data-panel]');
  const set = t.closest('[data-set]'), tog = t.closest('[data-tog]'), stp = t.closest('[data-step]');
  if (pan) { togglePanel(pan.dataset.panel); return; }
  if (stp) { cfg.fs = clamp(cfg.fs + (+stp.dataset.step), 13, 30); reflow(); drawPanel(); return; }
  if (set) {
    const k = set.dataset.set; let v = set.dataset.val;
    if (k === 'sleep') { sleepTimer(+v); drawPanel(); return; }
    if (!isNaN(v) && k !== 'theme' && k !== 'font' && k !== 'mode' && k !== 'tap' && k !== 'autoMode') v = +v;
    cfg[k] = v; DB.save();
    if (k === 'theme') { applyTheme(); updateNightBtn(); }
    if (k === 'mode') { layout(); gotoOffset(currentOffset()); }
    else reflow();
    drawPanel(); return;
  }
  if (tog) {
    const k = tog.dataset.tog; cfg[k] = !cfg[k]; DB.save();
    if (['header', 'footer', 'clock', 'pct', 'chpage'].includes(k)) { layout(); gotoOffset(currentOffset()); }
    else if (['bold', 'indent', 'justify'].includes(k)) reflow();
    else if (k === 'autoDark') { applyTheme(); updateNightBtn(); reflow(); }
    else if (k === 'full') applyFullscreen();
    drawPanel(); drawChrome(); return;
  }
  if (!act) return;
  const a = act.dataset.act;
  if (a === 'closeMenu') { if (Date.now() - (R.menuAt || 0) > 320) closeMenu(); }
  else if (a === 'leave') closeReader();
  else if (a === 'addShelf') { addShelf(R.book.id); toast('已加入书架'); $('.topBar .add').classList.add('hidden'); }
  else if (a === 'night') {
    cfg.theme = themeNow().dark ? 'paper' : cfg.nightTheme;
    DB.save(); applyTheme(); updateNightBtn(); paintOverlay(R.front, R.ch);
  }
  else if (a === 'prevCh') { jumpChapter(R.ch - 1, 0); drawSeek(); }
  else if (a === 'nextCh') { jumpChapter(R.ch + 1, 0); drawSeek(); }
  else if (a === 'bookmark') toggleBookmark();
  else if (a === 'resetType') { Object.assign(cfg, { fs:19, lh:1.62, ps:13, ls:.2, mx:22, bold:false }); DB.save(); reflow(); drawPanel(); }
  else if (a === 'speakToggle') { if (SP.on) stopSpeak(); else startSpeak(); drawPanel(); }
  else if (a === 'speakStop') { stopSpeak(); drawPanel(); }
  else if (a === 'autoToggle') { if (AUTO.on) stopAuto(); else startAuto(); }
}
function reflow() {
  const off = currentOffset();
  applyType(); applyTheme();
  layout(); gotoOffset(off); drawChrome();
}
document.addEventListener('input', e => {
  const r = e.target.closest('[data-rng]'), s = e.target.closest('[data-sel]');
  if (r) {
    const k = r.dataset.rng; cfg[k] = +r.value; DB.save();
    if (k === 'ls') reflow();
    else if (k === 'dim' || k === 'warm') applyTheme();
    const lbl = r.nextElementSibling;
    if (lbl) lbl.textContent = k === 'dim' ? Math.round((1 - cfg.dim) * 100) + '%'
      : k === 'warm' ? (cfg.warm < .02 ? '关' : Math.round(cfg.warm * 100) + '%')
      : k === 'rate' ? (.5 + cfg.rate * 1.5).toFixed(1) + 'x'
      : k === 'autoSpeed' ? Math.round(cfg.autoSpeed * 100) : (+cfg[k]).toFixed(1);
  }
  if (s) { cfg[s.dataset.sel] = s.value; DB.save(); if (SP.on) startSpeak(); }
});
/* 进度条拖动 */
document.addEventListener('pointerdown', e => {
  const s = e.target.closest('#seek'); if (!s) return;
  const rect = s.getBoundingClientRect();
  let lastTick = -1;
  const move = ev => {
    const p = clamp((ev.clientX - rect.left) / rect.width, 0, 1);
    s.querySelector('.fil').style.width = (p * 100) + '%';
    s.querySelector('.knb').style.left = (p * 100) + '%';
    const ci = clamp(Math.floor(p * chapCount(R.book)), 0, chapCount(R.book) - 1);
    $('#seekLabel').textContent = `${R.book.chapters[ci].title} · ${Math.round(p * 100)}%`;
    const tk = Math.round(p * 40);
    if (tk !== lastTick) { lastTick = tk; if (cfg.haptic) buzz(4); }
    s.dataset.p = p;
  };
  const up = () => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    const p = +s.dataset.p;
    if (isNaN(p)) return;
    const total = bookChars(R.book); let target = p * total, acc = 0, ci = 0, off = 0;
    for (let i = 0; i < chapCount(R.book); i++) {
      const len = R.book.chapters[i].text.length;
      if (acc + len >= target || i === chapCount(R.book) - 1) { ci = i; off = Math.max(0, Math.round(target - acc)); break; }
      acc += len;
    }
    jumpChapter(ci, off); drawSeek();
  };
  move(e);
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
});

/* 浏览界面点击 */
document.addEventListener('click', e => {
  if ($('#reader').contains(e.target)) return;
  const tab = e.target.closest('[data-tab]');
  if (tab) { switchTab(tab.dataset.tab); return; }
  const open = e.target.closest('[data-open]');
  if (open) { openBook(open.dataset.open, open.dataset.ch != null ? +open.dataset.ch : null); return; }
  const det = e.target.closest('[data-detail]');
  if (det) { openDetail(det.dataset.detail); return; }
  const cat = e.target.closest('[data-cat]');
  if (cat) { storeCat = cat.dataset.cat; renderStore(); return; }
  const bk = e.target.closest('[data-book]');
  if (bk) {
    const id = bk.dataset.book;
    if (editing) { sel.has(id) ? sel.delete(id) : sel.add(id); renderShelf(); }
    else openBook(id);
    return;
  }
  const tg = e.target.closest('[data-tog]');
  if (tg) { cfg[tg.dataset.tog] = !cfg[tg.dataset.tog]; DB.save(); drawPrefs(); return; }
  const st = e.target.closest('[data-pref]');
  if (st) { cfg[st.dataset.pref] = +st.dataset.val; DB.save(); drawPrefs(); return; }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  const a = act.dataset.act;
  if (a === 'toggleGrid') { gridMode = !gridMode; renderShelf(); }
  else if (a === 'edit') { editing = !editing; sel.clear(); renderShelf(); }
  else if (a === 'search') openSearch();
  else if (a === 'closeSub') sub.close();
  else if (a === 'pin') { sel.forEach(id => { const s = DB.shelf.find(x => x.id === id); if (s) s.pin = !s.pin; }); DB.save(); sel.clear(); renderShelf(); }
  else if (a === 'all') { sel = new Set(shelfBooks().map(b => b.id)); renderShelf(); }
  else if (a === 'del') { DB.shelf = DB.shelf.filter(s => !sel.has(s.id)); DB.save(); sel.clear(); renderShelf(); toast('已移出书架'); }
  else if (a === 'toggleShelf') { const id = $('#scr-sub').dataset.book; onShelf(id) ? (DB.shelf = DB.shelf.filter(s => s.id !== id), DB.save()) : addShelf(id); openDetail(id); }
  else if (a === 'prefs') openPrefs();
  else if (a === 'notes') openNotes();
  else if (a === 'about') openAbout();
  else if (a === 'a2hs') showA2HS(true);
});

/* =======================================================================
   PWA：图标 / 元信息 / 添加到主屏幕
   ======================================================================= */
function makeIcon(size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#FF8A3D'); g.addColorStop(1, '#F2531B');
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = `700 ${size * .56}px "Songti SC", serif`;
  x.fillText('橙', size / 2, size * .54);
  return c.toDataURL('image/png');
}
function setupPWA() {
  const add = (tag, attrs) => { const e = document.createElement(tag); Object.assign(e, attrs); document.head.appendChild(e); return e; };
  add('meta', { name:'viewport', content:'width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no' });
  add('meta', { name:'apple-mobile-web-app-capable', content:'yes' });
  add('meta', { name:'mobile-web-app-capable', content:'yes' });
  add('meta', { name:'apple-mobile-web-app-status-bar-style', content:'black-translucent' });
  add('meta', { name:'apple-mobile-web-app-title', content:'橙阅' });
  add('meta', { name:'theme-color', content:'#F3EDE1' });
  const icon = makeIcon(180);
  add('link', { rel:'apple-touch-icon', href:icon });
  add('link', { rel:'icon', href:makeIcon(64) });
  try {
    const manifest = { name:'橙阅', short_name:'橙阅', display:'standalone', background_color:'#F3EDE1',
      theme_color:'#FF6A2B', start_url:location.href, icons:[{ src:makeIcon(192), sizes:'192x192', type:'image/png' },
      { src:makeIcon(512), sizes:'512x512', type:'image/png' }] };
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type:'application/manifest+json' }));
    add('link', { rel:'manifest', href:url });
  } catch (e) {}
}
function standalone() {
  return window.navigator.standalone === true || matchMedia('(display-mode:standalone)').matches;
}
function showA2HS(force) {
  if (R.book) return;                       // 阅读时不打扰
  if (document.querySelector('.a2hs')) return;
  if (!force && (standalone() || localStorage.getItem('chengyue.a2hs') === 'off')) return;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const box = el('div', 'a2hs', `<div style="flex:1">
      ${isIOS ? '点击底部 <b>分享</b> 按钮，选择 <b>「添加到主屏幕」</b>，就能像 App 一样全屏打开橙阅。'
              : '在浏览器菜单里选择 <b>「安装应用 / 添加到主屏幕」</b>，即可全屏使用。'}</div>
    <button style="color:var(--accent);font-weight:600">知道了</button>`);
  document.body.appendChild(box);
  box.querySelector('button').onclick = () => { localStorage.setItem('chengyue.a2hs', 'off'); box.remove(); };
  setTimeout(() => box.parentNode && box.remove(), 12000);
}
function applyFullscreen() {
  document.documentElement.style.setProperty('--safeT',
    cfg.full ? 'env(safe-area-inset-top,0px)' : 'env(safe-area-inset-top,0px)');
}

/* =======================================================================
   启动
   ======================================================================= */
setupPWA();
renderTabs();
switchTab('shelf');
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { if (R.panel === 'speech') drawPanel(); };
matchMedia('(prefers-color-scheme:dark)').addEventListener('change', () => {
  if (R.book) { applyTheme(); updateNightBtn(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && R.book) { saveProgress(); recordRead(R.secs % 30, R.book.id); }
});
window.addEventListener('beforeunload', () => { if (R.book) saveProgress(); });
setTimeout(() => showA2HS(false), 2500);
</script>
